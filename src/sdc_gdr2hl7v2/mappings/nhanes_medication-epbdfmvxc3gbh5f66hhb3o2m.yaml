# NHANES Medication (FAIR Data Demo) to HL7 v2.5.1 ORU^R01
# Written by tools/build_mapping.py from tools/specs/nhanes_medication.py; labels in the comments.
mapping:
  id: nhanes-medication-hl7v2-2.5.1
  version: 1
  author: Axius SDC, Inc.
  date: '2026-10-25'
  description: 'The NHANES Medication model''s values in an HL7 v2.5.1 ORU^R01 message: the participant in PID, the reported
    medicine as an OBR group of observations, each reason an ICD-10-CM CWE.'
model:
  ct_id: epbdfmvxc3gbh5f66hhb3o2m
  schema_sha256: 26728c92987a1a2db68c120baf72767f00dd034c8e9499b348769a3a7249155f
target:
  name: HL7 Version 2
  version: 2.5.1
rules:
  # NHANES Medication Governed Record
  - {cluster: jo2kw48cijwgg64s6cud2el1, to: MSH, attributes: {MSH-3: SDC-GDR2HL7V2, MSH-4: FAIR Data Demo, MSH-11: T, PID-5: '""', OBX-11: F}}
  # Audit Event
  - {cluster: t2tvd3wylxrstdeu5aw6gkw1, to: '-', transform: omit, reason: 'the record''s audit event: an HL7 v2 message names its sending application, not the audit of the record'}
  # PROV Activity
  - {cluster: vmikfu0irht9fmq7q02t3oqs, to: '-', transform: omit, reason: 'the record''s provenance: HL7 v2 has no place for it'}
  # PROV Agent
  - {cluster: c179ilk2ns15cd5rzzdfd6f6, to: '-', transform: omit, reason: 'the record''s provenance: HL7 v2 has no place for it'}
  # Respondent Sequence Number (SEQN)
  - {component: uto4zszvpicva38wx77knz5y, to: PID-3, transform: format, format: '{}^^^NHANES^PI'}
  # NHANES Medication
  - {cluster: ncudsi2t2ij3rd2pmnnfr2j9, to: OBR}
  # Generic Drug Code (RXDDRGID)
  - {component: wypildaam8rrd87zkkjxl732, to: OBX, transform: format, format: '{}^^99RXD', attributes: {OBX-2: CWE}}
  # Generic Drug Name (RXDDRUG)
  - {component: lok5ozew80qmwah6h45jr69y, to: OBX, transform: copy}
  # Taken Prescription Medicine, Past Month (RXDUSE)
  - {component: a1zr74c1vayeeglk54da7gaf, to: OBX, transform: copy}
  # Number of Days Taken Medicine (RXDDAYS)
  - {component: jwgah039kcz574bbjvpxvfdj, to: OBX, transform: copy, units: {to: '@6', transform: code, table: {'%': '%', '/100{WBCs}': '/100{WBCs}', /min: /min, '1': '1', 10*3/uL: 10*3/uL, 10*6/uL: 10*6/uL, cigarettes: '{cigarettes}', fL: fL, g/dL: g/dL, items: '{items}', mg/dL: mg/dL, mmHg: 'mm[Hg]', mmol/L: mmol/L, months: mo, pg: pg, years: a, days: d}}}
  # Number of Prescription Medicines Taken (RXDCOUNT)
  - {component: v28gzpjsaxkkgjm470icwipg, to: OBX, transform: copy, units: {to: '@6', transform: code, table: {'%': '%', '/100{WBCs}': '/100{WBCs}', /min: /min, '1': '1', 10*3/uL: 10*3/uL, 10*6/uL: 10*6/uL, cigarettes: '{cigarettes}', fL: fL, g/dL: g/dL, items: '{items}', mg/dL: mg/dL, mmHg: 'mm[Hg]', mmol/L: mmol/L, months: mo, pg: pg, years: a, days: d}}}
  # Medication Reason 1
  - {cluster: i213d6dp9r4c0nmzxkgc0tja, to: ., order: 1}
  # Medication Reason 2
  - {cluster: u3qz0js9emqn2i7s5nyynmgt, to: ., order: 2}
  # Medication Reason 3
  - {cluster: rozfpmwczk4yuw4c2vom4gyx, to: ., order: 3}
  # Diagnosis (ICD-10-CM)
  - {cluster: jk4cboqk4me0yj2i04m8c2ad, to: OBX, attributes: {OBX-2: CWE, OBX-5.3: I10C}}
  # Diagnosis Code (ICD-10-CM)
  - {component: efimv7gxg5ompt8m6xb2b6k5, to: OBX-5.1, transform: copy}
  # Code Display Text (within Diagnosis (ICD-10-CM))
  - {component: eo5tlfr0576ypknys5alvcn0, within: [jk4cboqk4me0yj2i04m8c2ad], to: OBX-5.2, transform: copy}
  # Code System: ICD-10-CM
  - {component: jwgx8nvbtsim7ck4uqmpqyl2, to: OBX-5.3, transform: code, table: {'http://hl7.org/fhir/sid/icd-10-cm': I10C}, on_miss: omit}
